<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>USN Argentum | Rover 3D View</title>
  <link rel="icon" href="/static/img/favicon.ico?v=3" sizes="32x32"/>
  <link rel="icon" href="/static/img/favicon.svg?v=3" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing:border-box; }
    :root {
      --bg:#080808;
      --bg2:#0d0d0d;
      --bg3:#141414;
      --accent:#2ecfcf;
      --accent2:#5de0e0;
      --text:#e8eaf0;
      --muted:#6a7080;
      --border:rgba(46,207,207,0.15);
    }
    html, body {
      margin:0; padding:0;
      width:100%; height:100%;
      overflow:hidden;
    }
    body {
      background:var(--bg);
      color:var(--text);
      font-family:'Inter',sans-serif;
      display:flex;
      flex-direction:column;
      position:relative;
    }
    /* photo layer on its own animatable pseudo-element, zooming on load the
       same way the home page's hero does */
    body::before {
      content:''; position:fixed; inset:0; z-index:-2;
      background:url('/static/img/daniel-leone-g30P1zcOzXo-unsplash.jpg') center center / cover no-repeat;
      transform:scale(1.4); animation:heroBgZoomOut 4s ease 0.2s forwards;
      pointer-events:none;
    }
    @keyframes heroBgZoomOut { to { transform:scale(1); } }
    /* subtle dark tint over the photo, same idea as the home page's hero
       overlay, so white text stays readable against a busy image */
    body::after {
      content:''; position:fixed; inset:0; z-index:-1;
      background:linear-gradient(180deg, rgba(8,8,8,0.55) 0%, rgba(8,8,8,0.7) 100%);
      pointer-events:none;
    }
    nav {
      position:fixed; top:0; left:0; right:0; z-index:100;
      height:68px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 2rem;
      background:transparent;
      border-bottom:1px solid transparent;
    }
    .nav-logo {
      text-decoration:none;
      display:flex; align-items:center;
      line-height:1;
    }
    .nav-links { display:flex; gap:2rem; list-style:none; align-items:center; }
    .nav-links a {
      color:rgba(255,255,255,0.7); text-decoration:none; font-size:0.9rem;
      font-weight:500; letter-spacing:0.04em; text-transform:uppercase; transition:color 0.2s;
    }
    .nav-links a:hover { color:#fff; }
    .nav-links a.nav-cta {
      font-weight:800; padding:0.5rem 1.1rem; border-radius:999px;
      animation:navCtaToggle 1.4s steps(1) infinite, navCtaPulse 2.2s ease-in-out infinite;
    }
    @keyframes navCtaToggle {
      0%, 49% { color:rgba(255,255,255,0.7); }
      50%, 100% { color:var(--accent); }
    }
    @keyframes navCtaPulse {
      0%, 100% { box-shadow:0 0 0 0 rgba(46,207,207,0.55); }
      50% { box-shadow:0 0 0 8px rgba(46,207,207,0); }
    }
    .hamburger { display:none; flex-direction:column; gap:5px; cursor:pointer; }
    .hamburger span { width:24px; height:2px; background:var(--text); display:block; }
    @media(max-width:768px) {
      nav { padding:0 1.5rem; }
      .nav-links { display:none; }
      .hamburger { display:flex; }
    }
    .layout {
      flex:1;
      display:flex;
      overflow:hidden;
      min-height:0;
      padding-top:68px; /* nav is now fixed/overlaid, so reserve its height here */
    }
    #canvas-wrap {
      flex:1;
      position:relative;
      background:transparent;
      min-width:0;
      min-height:0;
    }
    #c {
      position:absolute;
      top:0; left:0;
      width:100%; height:100%;
      display:block;
    }
    .canvas-hint {
      position:absolute; bottom:1rem; left:50%;
      transform:translateX(-50%); z-index:5;
      background:rgba(8,8,8,0.82);
      border:1px solid var(--border);
      padding:0.4rem 1rem;
      border-radius:20px;
      font-size:0.73rem; color:#ffffff;
      pointer-events:none; white-space:nowrap;
    }
    .sidebar {
      width:220px; flex-shrink:0;
      background:rgba(8,8,8,0.2);
      backdrop-filter:blur(3px);
      -webkit-backdrop-filter:blur(3px);
      border-left:1px solid var(--border);
      overflow-y:auto;
      padding:0.9rem 1rem;
      display:flex; flex-direction:column; gap:0.9rem;
    }
    .sb-section h3 {
      font-family:'Barlow Condensed',sans-serif;
      font-size:0.76rem; font-weight:700;
      letter-spacing:0.1em; text-transform:uppercase;
      color:var(--accent);
      margin-bottom:0.45rem;
      padding-bottom:0.25rem;
      border-bottom:1px solid var(--border);
    }
    .toggle-row {
      display:flex; align-items:center; justify-content:space-between;
      padding:0.3rem 0;
      border-bottom:1px solid rgba(255,255,255,0.04);
      font-size:0.72rem;
    }
    .toggle-row label { color:#ffffff; font-weight:500; }
    .tog {
      width:34px; height:18px;
      background:var(--bg3);
      border:1px solid var(--border);
      border-radius:9px;
      position:relative; cursor:pointer;
      transition:background 0.2s;
    }
    .tog.on { background:rgba(46,207,207,0.25); border-color:var(--accent); }
    .tog::after {
      content:''; position:absolute;
      width:12px; height:12px;
      border-radius:50%;
      background:var(--muted);
      top:2px; left:2px;
      transition:transform 0.2s, background 0.2s;
    }
    .tog.on::after { transform:translateX(16px); background:var(--accent); }
    .arm-sliders { display:flex; flex-direction:column; gap:0.4rem; }
    .slider-row { display:flex; flex-direction:column; gap:0.15rem; }
    .slider-row label {
      font-size:0.7rem; color:#ffffff; font-weight:500;
      display:flex; justify-content:space-between;
    }
    .slider-row label span { color:var(--accent); }
    input[type=range] { width:100%; height:20px; accent-color:var(--accent); cursor:pointer; }
    @media(max-width:700px) {
      .layout { flex-direction:column; }
      #canvas-wrap { flex:1 1 auto; min-height:0; }
      .sidebar {
        width:100%; flex:0 0 auto; max-height:32vh;
        border-left:none; border-top:1px solid var(--border);
        padding:0.6rem 0.9rem; gap:0.5rem;
      }
      .sb-section h3 { margin-bottom:0.3rem; padding-bottom:0.2rem; }
      .arm-sliders { gap:0.28rem; }
      .slider-row label { font-size:0.66rem; }
      .toggle-row { padding:0.22rem 0; font-size:0.7rem; }
      .canvas-hint { display:none; }
      .mobile-hint {
        position:absolute; top:1rem; right:1rem; z-index:5;
        background:rgba(8,8,8,0.1);
        backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
        border:1px solid var(--border);
        padding:0.35rem 0.75rem; border-radius:20px;
        font-size:0.7rem; color:#ffffff; pointer-events:none;
      }
    }
    @media(min-width:701px) {
      .mobile-hint { display:none; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
     <img src="/static/img/secondarylogo.png" alt="Secondary Logo" style="height:40px;width:auto;display:block;"/>
  </a>
  <ul class="nav-links">
    <li><a href="index.html#hero">Home</a></li>
    <li><a href="team.html">TEAM</a></li>
    <li><a href="rover-3d.html">Rover</a></li>
    <li><a href="blog.html">Blog</a></li>
    <li><a href="join-us.html" class="nav-cta">Join Us</a></li>
  </ul>
  <div class="hamburger" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </div>
</nav>

<div class="layout">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div class="canvas-hint">Drag to rotate  |  Scroll to zoom  |  Right-click to pan</div>
    <div class="mobile-hint">1 finger rotate  |  2 fingers zoom &amp; pan</div>
  </div>

  <div class="sidebar">
    <div class="sb-section">
      <h3>Arm Pose</h3>
      <div class="arm-sliders">
        <div class="slider-row">
          <label>Base <span id="lbl-turret">0</span></label>
          <input type="range" min="-180" max="180" value="0" oninput="setArm('turret',this.value)"/>
        </div>
        <div class="slider-row">
          <label>Shoulder <span id="lbl-shoulder">0</span></label>
          <input type="range" min="-90" max="90" value="0" oninput="setArm('shoulder',this.value)"/>
        </div>
        <div class="slider-row">
          <label>Elbow <span id="lbl-elbow">60</span></label>
          <input type="range" min="-120" max="120" value="60" oninput="setArm('elbow',this.value)"/>
        </div>
        <div class="slider-row">
          <label>Wrist <span id="lbl-wrist">-30</span></label>
          <input type="range" min="-120" max="120" value="-30" oninput="setArm('wrist',this.value)"/>
        </div>
      </div>
    </div>

    <div class="sb-section">
      <h3>Display</h3>
      <div class="toggle-row">
        <label>Auto Rotate</label>
        <div class="tog on" id="tog-rot" onclick="toggleAutoRot()"></div>
      </div>
      <div class="toggle-row">
        <label>Wireframe</label>
        <div class="tog" id="tog-wire" onclick="toggleWire()"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js" integrity="sha384-fljlqkjWlmSFjkESkQvm77heIZpoWmXEOzlCA7kOpGUH+95Zk0yGfQieWM2q136E" crossorigin="anonymous"></script>
<script>

// ─── ALL GLOBALS DEFINED HERE (outside any function) ───
var renderer, camera, scene;
var turretGroup, upperArmPivot, forearmPivot, wristPivot, fingerL, fingerR;
var shoulderAxisLocal = new THREE.Vector3(0, 0, 1); // set once the model loads, see below
var SHOULDER_AXIS_DEG = 20; // degrees right of raw local-X, locked via the gizmo
var allMeshes = [];
var autoRot = true;
var drag = false, rightDrag = false;
var prevMouse = {x:0, y:0};
var sph = {theta:0.55, phi:1.08, r:7.5};
var tgt;
var wireOn = false;

// ─── MOBILE NAV TOGGLE (same behavior as the other pages' script.js) ───
function toggleMenu() {
  var links = document.querySelector('.nav-links');
  var isOpen = links.getAttribute('data-open') === 'true';
  if (isOpen) {
    links.removeAttribute('style');
    links.setAttribute('data-open', 'false');
  } else {
    // anchored 20px above nav's bottom edge -- flush against the nav bar
    // (the plain top:100% anchor left a visible ~20px gap on device)
    links.style.cssText = 'display:flex;flex-direction:column;position:absolute;top:calc(100% - 20px);left:0;right:0;background:rgba(8,8,8,0.1);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:2rem;gap:1.5rem;border-bottom:1px solid rgba(46,207,207,0.15);z-index:99;';
    links.setAttribute('data-open', 'true');
  }
}

// ─── MATERIAL FACTORY (always returns a new instance) ───
function newMat(col, rough, metal, emissive) {
  return new THREE.MeshStandardMaterial({
    color:     col,
    roughness: (rough    !== undefined) ? rough    : 0.7,
    metalness: (metal    !== undefined) ? metal    : 0.15,
    emissive:  (emissive !== undefined) ? emissive : 0x000000
  });
}

function addMesh(geo, mat, parent) {
  var m = new THREE.Mesh(geo, mat);
  m.castShadow    = true;
  m.receiveShadow = true;
  parent.add(m);
  allMeshes.push(m);
  return m;
}

// ─── CAMERA APPLY ───
function applyCamera() {
  camera.position.set(
    tgt.x + sph.r * Math.sin(sph.phi) * Math.sin(sph.theta),
    tgt.y + sph.r * Math.cos(sph.phi),
    tgt.z + sph.r * Math.sin(sph.phi) * Math.cos(sph.theta)
  );
  camera.lookAt(tgt);
}

// ─── ARM CONTROL ───
function setArm(joint, val) {
  var v = parseFloat(val);
  var D = THREE.MathUtils.degToRad;
  if (joint === 'turret'   && turretGroup)   { turretGroup.rotation.y   = D(v);  document.getElementById('lbl-turret').textContent   = v; }
  if (joint === 'shoulder' && upperArmPivot) {
    upperArmPivot.quaternion.setFromAxisAngle(shoulderAxisLocal, D(v));
    document.getElementById('lbl-shoulder').textContent = v;
  }
  if (joint === 'elbow'    && forearmPivot)  { forearmPivot.rotation.x  = D(v);  document.getElementById('lbl-elbow').textContent    = v; }
  if (joint === 'wrist'    && wristPivot)    { wristPivot.rotation.x    = D(v);  document.getElementById('lbl-wrist').textContent    = v; }
  if (joint === 'grip' && fingerL) {
    // single combined linear-gripper part (model has no separate L/R finger nodes)
    var extend = (v / 100) * 0.03;
    fingerL.position.x = fingerL.userData.baseX + extend;
    if (fingerR) fingerR.position.x = -extend;
    document.getElementById('lbl-grip').textContent = Math.round(v) + '%';
  }
}

// ─── DISPLAY TOGGLES ───
function toggleAutoRot() {
  autoRot = !autoRot;
  document.getElementById('tog-rot').classList.toggle('on', autoRot);
}

function toggleWire() {
  wireOn = !wireOn;
  document.getElementById('tog-wire').classList.toggle('on', wireOn);
  for (var i = 0; i < allMeshes.length; i++) {
    if (allMeshes[i].material) { allMeshes[i].material.wireframe = wireOn; }
  }
}

// ─── INIT (runs after page load) ───
function init() {
  var wrap   = document.getElementById('canvas-wrap');
  var canvas = document.getElementById('c');

  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x000000, 0); // transparent -- the page's photo shows through

  camera = new THREE.PerspectiveCamera(42, wrap.offsetWidth / wrap.offsetHeight, 0.05, 300);
  tgt    = new THREE.Vector3(0, 0.8, 0);

  function updateSize() {
    var w = wrap.offsetWidth;
    var h = wrap.offsetHeight;
    if (w < 1 || h < 1) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  updateSize();
  window.addEventListener('resize', updateSize);

  // scene
  scene = new THREE.Scene();
  scene.background = null; // transparent, so the page's photo shows through
  // no fog -- it would tint the edges with its own color against a
  // transparent background instead of blending, unlike before

  // lights
  scene.add(new THREE.AmbientLight(0x6a7688, 2.4));

  var key = new THREE.DirectionalLight(0xfff5e8, 3.0);
  key.position.set(6, 10, 5);
  key.castShadow = true;
  key.shadow.mapSize.width  = 2048;
  key.shadow.mapSize.height = 2048;
  key.shadow.camera.near   = 1;
  key.shadow.camera.far    = 40;
  key.shadow.camera.left   = -8;
  key.shadow.camera.right  =  8;
  key.shadow.camera.top    =  8;
  key.shadow.camera.bottom = -8;
  scene.add(key);

  var fill = new THREE.DirectionalLight(0x6688cc, 1.4);
  fill.position.set(-8, 3, -4);
  scene.add(fill);

  var back = new THREE.DirectionalLight(0x2ecfcf, 0.6);
  back.position.set(0, -2, -10);
  scene.add(back);

  // rover root
  var rover = new THREE.Group();
  scene.add(rover);

  // ── LOAD REAL ROVER MODEL (replaces procedural placeholder) ──
  var MODEL_SCALE = 4.5; // model's native size is ~0.4m; scale up to match old camera framing
  var gltfLoader = new THREE.GLTFLoader();
  gltfLoader.load('static/models/taurus_rover.glb', function (gltf) {
    var model = gltf.scene;
    model.scale.setScalar(MODEL_SCALE);
    rover.add(model);
    model.updateMatrixWorld(true);

    model.traverse(function (obj) {
      if (obj.isMesh) {
        obj.castShadow    = true;
        obj.receiveShadow = true;
        allMeshes.push(obj);
      }
    });

    // ── RIG THE ARM: the file ships every part as a flat sibling with a
    // fixed baked transform (no bones/rig). Re-parent the named joints into
    // a proper pivot chain so each slider rotates everything downstream of
    // it, using attach() so the visual position doesn't jump on re-parent.
    var j1 = model.getObjectByName('A-J1');                  // turret / base yaw
    var j2 = model.getObjectByName('A-J2');                  // shoulder
    var j3 = model.getObjectByName('A-J3');                  // elbow
    var j4 = model.getObjectByName('A-J4');                  // wrist
    var j5 = model.getObjectByName('A-J5-Fingers_Linear');   // gripper (linear)

    if (j1 && j2) j1.attach(j2);
    if (j2 && j3) j2.attach(j3);
    if (j3 && j4) j3.attach(j4);
    if (j4 && j5) j4.attach(j5);

    // Turret needs a guaranteed flat, world-horizontal spin -- j1's own baked
    // orientation from the file isn't aligned to world axes, so rotating it
    // directly would wobble/tilt instead of spinning flat. Wrap it in a bare
    // pivot (identity rotation) placed at its world position, and rotate
    // that pivot instead; attach() preserves j1's visual pose exactly.
    var turretPivot = null;
    if (j1) {
      turretPivot = new THREE.Group();
      turretPivot.position.copy(j1.getWorldPosition(new THREE.Vector3()));
      rover.add(turretPivot);
      turretPivot.attach(j1);
    }

    // Shoulder pivot: placed exactly at A-J2's transform relative to A-J1,
    // read straight off the loaded objects (matrixWorld) so it's immune to
    // this file's baked axis convention (Blender's glTF export rotates
    // everything to Y-up; a parent-relative transform is invariant to
    // that, so this reproduces the Blender-verified placement exactly).
    //
    // Split into TWO nested groups, same as the Blender rig's per-joint
    // "_origin"/"_joint" empty pair -- and for the same reason: A-J1->A-J2
    // is a *compound* rotation (not a pure single-axis one), and three.js
    // stores rotation as an XYZ Euler. Baking that compound rest rotation
    // directly into the object whose `.rotation.x` the slider drives means
    // `.rotation.x = v` recomposes Euler(v, oldY, oldZ) -- a DIFFERENT
    // rotation, not "spin v further around the rest orientation's own X
    // axis" -- so the arm swings around the wrong axis. (Elbow/wrist don't
    // need this split only because A-J2->A-J3 and A-J3->A-J4 both happen
    // to have zero relative rotation in the source URDF, so there's no
    // compound rotation for their sliders to fight with.)
    // shoulderOrigin: fixed rest transform, never touched.
    // shoulderJoint:  identity at rest, parented under shoulderOrigin --
    //                 THIS is what `.rotation.x` poses, cleanly.
    var shoulderPivot = null;
    if (j1 && j2) {
      j1.updateMatrixWorld(true);
      j2.updateMatrixWorld(true);
      var relMatrix = new THREE.Matrix4()
        .copy(j1.matrixWorld).invert()
        .multiply(j2.matrixWorld);
      var shoulderOrigin = new THREE.Group();
      relMatrix.decompose(shoulderOrigin.position, shoulderOrigin.quaternion, shoulderOrigin.scale);
      j1.add(shoulderOrigin);
      var shoulderJoint = new THREE.Group();
      shoulderOrigin.add(shoulderJoint);
      shoulderJoint.attach(j2);
      shoulderPivot = shoulderJoint;

      // Shoulder rotation axis, calibrated and locked in: perpendicular to
      // raw local-X by SHOULDER_AXIS_DEG, negated -- gives the correct
      // vertical swing plane. Converted into shoulderOrigin's local space
      // via its live world quaternion so it can't pick up a sign/order
      // mistake. setArm() spins shoulderJoint around this axis.
      var axisWorld = new THREE.Vector3(0, 0, 1)
        .applyAxisAngle(new THREE.Vector3(0, 1, 0), THREE.MathUtils.degToRad(-SHOULDER_AXIS_DEG))
        .negate();
      var originWorldQuat = new THREE.Quaternion();
      shoulderOrigin.getWorldQuaternion(originWorldQuat);
      shoulderAxisLocal = axisWorld.applyQuaternion(originWorldQuat.clone().invert()).normalize();
    }

    turretGroup   = turretPivot;
    upperArmPivot = shoulderPivot;
    forearmPivot  = j3;
    wristPivot    = j4;
    fingerL       = j5; // single combined linear-gripper part (see setArm)
    fingerR       = null;
    if (fingerL) fingerL.userData.baseX = fingerL.position.x;

    // initial arm pose (moved here from init() since joints load async)
    // shoulder starts at 0 -- its rest transform IS the correct attachment
    if (forearmPivot)  forearmPivot.rotation.x  = THREE.MathUtils.degToRad(60);
    if (wristPivot)    wristPivot.rotation.x    = THREE.MathUtils.degToRad(-30);
  }, undefined, function (err) {
    console.error('Failed to load rover model:', err);
  });

  // ── MOUSE / TOUCH EVENTS ──
  applyCamera();

  canvas.addEventListener('mousedown', function(e) {
    drag      = true;
    rightDrag = (e.button === 2);
    prevMouse = {x: e.clientX, y: e.clientY};
    autoRot   = false;
    document.getElementById('tog-rot').classList.remove('on');
  });
  canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  window.addEventListener('mouseup',   function() { drag = false; });
  window.addEventListener('mousemove', function(e) {
    if (!drag) return;
    var dx = e.clientX - prevMouse.x;
    var dy = e.clientY - prevMouse.y;
    prevMouse = {x: e.clientX, y: e.clientY};
    if (rightDrag) {
      var right = new THREE.Vector3();
      camera.getWorldDirection(right);
      right.cross(camera.up).normalize();
      tgt.addScaledVector(right, -dx * 0.004);
      tgt.y += dy * 0.004;
    } else {
      sph.theta -= dx * 0.007;
      sph.phi    = Math.max(0.12, Math.min(Math.PI - 0.12, sph.phi + dy * 0.007));
    }
    applyCamera();
  });
  canvas.addEventListener('wheel', function(e) {
    sph.r = Math.max(1.5, Math.min(25, sph.r + e.deltaY * 0.012));
    applyCamera();
  }, {passive: true});

  // ── TOUCH: 1 finger rotate, 2 finger pinch-zoom + pan, momentum ──
  var touches       = {};
  var lastPinchDist = null;
  var lastPanCenter = null;
  var velTheta      = 0;
  var velPhi        = 0;
  var lastTouchTime = 0;
  var lastDx        = 0;
  var lastDy        = 0;

  function getTouchById(id) { return touches[id] || null; }

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    autoRot = false;
    document.getElementById('tog-rot').classList.remove('on');
    velTheta = 0; velPhi = 0;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      touches[t.identifier] = {x: t.clientX, y: t.clientY};
    }
    lastPinchDist = null;
    lastPanCenter = null;
  }, {passive: false});

  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();

    if (e.touches.length === 2) {
      // ── TWO FINGER: PINCH ZOOM + PAN TOGETHER ──
      var t0 = e.touches[0];
      var t1 = e.touches[1];
      var cx = (t0.clientX + t1.clientX) / 2;
      var cy = (t0.clientY + t1.clientY) / 2;
      var dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);

      if (lastPinchDist !== null) {
        var delta = lastPinchDist - dist;
        sph.r = Math.max(1.5, Math.min(25, sph.r + delta * 0.03));
      }
      if (lastPanCenter !== null) {
        var pdx = cx - lastPanCenter.x;
        var pdy = cy - lastPanCenter.y;
        var right = new THREE.Vector3();
        camera.getWorldDirection(right);
        right.cross(camera.up).normalize();
        tgt.addScaledVector(right, -pdx * 0.006);
        tgt.y += pdy * 0.006;
      }
      applyCamera();

      lastPinchDist = dist;
      lastPanCenter = {x: cx, y: cy};
    } else if (e.touches.length === 1) {
      lastPanCenter = null;
      // ── SINGLE FINGER ROTATE ──
      var touch = e.touches[0];
      var prev  = touches[touch.identifier];
      if (!prev) return;
      var now = Date.now();
      var dt  = Math.max(1, now - lastTouchTime);
      lastTouchTime = now;
      var dx = touch.clientX - prev.x;
      var dy = touch.clientY - prev.y;
      lastDx = dx; lastDy = dy;
      // higher sensitivity on mobile
      sph.theta -= dx * 0.012;
      sph.phi    = Math.max(0.12, Math.min(Math.PI - 0.12, sph.phi + dy * 0.012));
      touches[touch.identifier] = {x: touch.clientX, y: touch.clientY};
      // store velocity for momentum
      velTheta = -(dx / dt) * 10;
      velPhi   =  (dy / dt) * 10;
      applyCamera();
    }

    // Keep every active touch's cached position fresh, not just the one
    // used above. Without this, a finger held through a 2/3-finger pinch
    // or pan never gets its {x,y} updated -- so if fingers lift one at a
    // time and it briefly drops to 1 finger, the rotate calc measures dx/dy
    // against a stale position from before the gesture, producing a huge
    // spurious velocity that shows up as a "flip" right as the last finger
    // releases.
    for (var ti = 0; ti < e.touches.length; ti++) {
      var ct = e.touches[ti];
      touches[ct.identifier] = {x: ct.clientX, y: ct.clientY};
    }
  }, {passive: false});

  canvas.addEventListener('touchend', function(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      delete touches[e.changedTouches[i].identifier];
    }
    lastPinchDist = null;
    lastPanCenter = null;
    // apply momentum on lift
    if (e.touches.length === 0) {
      var momentumId = requestAnimationFrame(function applyMomentum() {
        if (Math.abs(velTheta) < 0.0005 && Math.abs(velPhi) < 0.0005) return;
        sph.theta += velTheta * 0.016;
        sph.phi    = Math.max(0.12, Math.min(Math.PI - 0.12, sph.phi + velPhi * 0.016));
        velTheta  *= 0.88;
        velPhi    *= 0.88;
        applyCamera();
        requestAnimationFrame(applyMomentum);
      });
    }
  }, {passive: true});

  // ── RENDER LOOP ──
  function animate() {
    requestAnimationFrame(animate);
    if (autoRot) {
      sph.theta += 0.003;
      applyCamera();
    }
    renderer.render(scene, camera);
  }
  animate();
}

// Start after full page load
window.addEventListener('load', init);
</script>
</body>
</html>
